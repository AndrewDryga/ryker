# GoReleaser is the single release artifact definition. Validate it locally with:
#   make snapshot
version: 2

project_name: responder

builds:
  - id: responder
    main: ./cmd/responder
    binary: responder
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/AndrewDryga/responder/internal/version.Version={{ .Version }}

archives:
  - id: responder
    formats: [tar.gz]
    name_template: "responder_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE
      - SECURITY.md
      - config/**
      - deploy/**
      - docs/**

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: ./dist-input/responder-elixir.tar.gz
      name_template: "responder_{{ .Version }}_elixir_linux_amd64.tar.gz"
    - glob: ./scripts/install-elixir-release.sh
      name_template: install-elixir-release.sh
    - glob: ./scripts/check-elixir-release.sh
      name_template: check-elixir-release.sh
    - glob: ./scripts/activate-elixir-release.sh
      name_template: activate-elixir-release.sh

# Sign the checksum file rather than each archive. Verifying the bundle and then
# the archive checksum gives one keyless trust root for every release artifact.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    output: true

release:
  github:
    owner: AndrewDryga
    name: responder
  extra_files:
    - glob: ./dist-input/responder-elixir.tar.gz
      name_template: "responder_{{ .Version }}_elixir_linux_amd64.tar.gz"
    - glob: ./scripts/install-elixir-release.sh
      name_template: install-elixir-release.sh
    - glob: ./scripts/check-elixir-release.sh
      name_template: check-elixir-release.sh
    - glob: ./scripts/activate-elixir-release.sh
      name_template: activate-elixir-release.sh
  prerelease: auto
  footer: |
    **Full Changelog**: https://github.com/AndrewDryga/responder/compare/{{ .PreviousTag }}...{{ .Tag }}
