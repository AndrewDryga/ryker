name: ryker

services:
  volume-init:
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    restart: "no"
    user: root
    # Only what the runtime user does not already own: re-owning everything walked and
    # rewrote about 13 GB of the worker's caches on every start (2026-10-04 review).
    command:
      - sh
      - -c
      - find /var/lib/ryker /var/lib/coop /var/lib/ryker-coop \( ! -user 1000 -o ! -group 1000 \) -exec chown -h 1000:1000 {} +
    volumes:
      - ryker-state:/var/lib/ryker
      - ryker-coop-state:/var/lib/coop
      - ryker-coop-config:/var/lib/ryker-coop

  database:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    restart: unless-stopped
    environment:
      POSTGRES_DB: ryker
      POSTGRES_USER: ryker
      POSTGRES_PASSWORD: ${RYKER_DATABASE_PASSWORD:?run ./install.sh first}
    volumes:
      - ryker-database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryker -d ryker"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  ryker:
    image: ${RYKER_IMAGE:-ryker:local}
    build:
      context: .
      args:
        RYKER_VERSION: ${RYKER_VERSION:?run ./install.sh first}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ecto://ryker:${RYKER_DATABASE_PASSWORD}@database/ryker
      # About thirty lanes poll the database beside the console and the worker gateway.
      # Ten connections ran out while the worker was slow to answer (2026-10-09 19:54
      # UTC), and a routing worker that lost its query held its message for five minutes.
      POOL_SIZE: ${RYKER_POOL_SIZE:-25}
      RYKER_CONTAINER: "true"
      RYKER_CONTROL_IP: 0.0.0.0
      RYKER_CONTROL_PORT: 4321
      # The console admits the address published traffic arrives from (this network's
      # gateway) and nothing else on the network, so a box the worker runs model work in
      # cannot reach it.
      RYKER_CONTROL_PEER: ${RYKER_CONTROL_PEER:-172.30.42.1}
      # Every published request arrives from that gateway, so the console cannot tell who
      # sent it; it refuses to start when it is published beyond loopback.
      RYKER_CONTROL_BIND: ${RYKER_CONTROL_BIND:-127.0.0.1}
      RYKER_CONTROL_PUBLIC_URL: ${RYKER_CONTROL_PUBLIC_URL:-http://127.0.0.1:${RYKER_CONTROL_PORT:-4321}}
      RYKER_CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${RYKER_CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}
      RYKER_CLOUDFLARE_ACCESS_AUD: ${RYKER_CLOUDFLARE_ACCESS_AUD:-}
      RYKER_GITHUB_IP: 0.0.0.0
      RYKER_GITHUB_PORT: 4319
      RYKER_GITHUB_PUBLIC_URL: ${RYKER_GITHUB_PUBLIC_URL:-http://127.0.0.1:4319/v1/github}
      RYKER_WEBHOOK_IP: 0.0.0.0
      RYKER_WEBHOOK_PORT: 4320
      RYKER_WEBHOOK_PUBLIC_URL: ${RYKER_WEBHOOK_PUBLIC_URL:-http://127.0.0.1:4320}
      RYKER_CHECKPOINT_KEY: ${RYKER_CHECKPOINT_KEY:?run ./install.sh first}
      RYKER_CREDENTIAL_KEY: ${RYKER_CREDENTIAL_KEY:?run ./install.sh first}
      RYKER_STATE_TOOLS_TOKEN: ${RYKER_STATE_TOOLS_TOKEN:?run ./install.sh first}
      RYKER_WORKER_IP: 0.0.0.0
      RYKER_WORKER_PORT: 4322
      RYKER_WORKER_PUBLIC_URL: https://172.30.42.10:4322
      RYKER_COMPOSE_WORKER_IP: 172.30.42.10
      RYKER_WORKER_CA_FILE: /var/lib/ryker/pki/ca.pem
      RYKER_WORKER_CA_KEY_FILE: /var/lib/ryker/pki/ca-key.pem
      RYKER_WORKER_CERT_FILE: /var/lib/ryker/pki/server.pem
      RYKER_WORKER_KEY_FILE: /var/lib/ryker/pki/server-key.pem
      RYKER_BUNDLED_COOP_WORKER_ID: ryker-compose
      RYKER_BUNDLED_COOP_WORKSPACE: ryker-compose
      RYKER_BUNDLED_COOP_SHARED: /var/lib/ryker-coop
      LOG_LEVEL: ${RYKER_LOG_LEVEL:-info}
      # Voice messages on the whisper services below. A Mac can name its GPU instead, much
      # faster (scripts/voice-service.sh); while they cannot answer, Ryker's own small model
      # reads the recording.
      RYKER_WHISPER_URL: ${RYKER_WHISPER_URL:-http://whisper:8080}
      RYKER_WHISPER_DETECT_URL: ${RYKER_WHISPER_DETECT_URL:-http://whisper-detect:8080}
      RYKER_VOICE_LANGUAGES: ${RYKER_VOICE_LANGUAGES:-}
      # Routing's search for earlier work by meaning, on the embeddings service below; while it
      # cannot answer, routing searches by words and identifiers alone.
      RYKER_EMBEDDINGS_URL: ${RYKER_EMBEDDINGS_URL:-http://embeddings:8080}
      RYKER_EMBEDDINGS_MODEL: ${RYKER_EMBEDDINGS_MODEL:-}
    volumes:
      - ryker-state:/var/lib/ryker
      - ryker-coop-config:/var/lib/ryker-coop
    # A Mac's GPU whisper runs on the host (scripts/voice-service.sh). Docker Desktop and
    # OrbStack name the host already; Docker on Linux needs this.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        ipv4_address: 172.30.42.10
      models: {}
    ports:
      - "${RYKER_CONTROL_BIND:-127.0.0.1}:${RYKER_CONTROL_PORT:-4321}:4321"
      - "${RYKER_GITHUB_BIND:-127.0.0.1}:${RYKER_GITHUB_PORT:-4319}:4319"
      - "${RYKER_WEBHOOK_BIND:-127.0.0.1}:${RYKER_WEBHOOK_PORT:-4320}:4320"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4321/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  ryker-coop-docker:
    image: docker:28.2.2-dind-alpine3.21@sha256:bbc590727c1e4fe707877314ff4f0f977bdda2985c485f2b044db0e18979efb3
    privileged: true
    restart: unless-stopped
    depends_on:
      volume-init:
        condition: service_completed_successfully
    environment:
      DOCKER_TLS_CERTDIR: ""
    # The worker reaches this daemon only through the socket the two share; Coop starts a
    # review's services only through a local unix socket, and a daemon listening on the network
    # could be driven by any container on it. The socket belongs to the worker's coop group.
    # dockerd comes first: given a command that starts with a flag, the image's entrypoint adds
    # its own --host=tcp://0.0.0.0:2375.
    command:
      - "dockerd"
      - "--host=unix:///var/run/docker.sock"
      - "--host=unix:///run/ryker-coop-docker/docker.sock"
      - "--group=1000"
    volumes:
      - ryker-coop-docker:/var/lib/docker
      - ryker-coop-state:/var/lib/coop
      - ryker-coop-docker-socket:/run/ryker-coop-docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 5s
      retries: 60
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  ryker-coop:
    # The Coop version and revision are pinned once, in
    # deploy/compose/coop/Dockerfile. To run another Coop, build its image and
    # name it in RYKER_COOP_IMAGE; overriding the version alone only relabeled
    # the pinned revision (2026-10-04 review).
    image: ${RYKER_COOP_IMAGE:-ryker-coop:local}
    build:
      context: .
      dockerfile: deploy/compose/coop/Dockerfile
    restart: unless-stopped
    depends_on:
      ryker:
        condition: service_healthy
      ryker-coop-docker:
        condition: service_healthy
    environment:
      DOCKER_HOST: unix:///run/ryker-coop-docker/docker.sock
      RYKER_BUNDLED_COOP_WORKER_ID: ryker-compose
      RYKER_BUNDLED_COOP_WORKSPACE: ryker-compose
    volumes:
      - ryker-coop-state:/var/lib/coop
      - ryker-coop-config:/var/lib/ryker-coop
      - ryker-coop-docker-socket:/run/ryker-coop-docker
    healthcheck:
      test: ["CMD", "coop", "sessions", "doctor", "--socket", "/var/lib/coop/sessions/control.sock"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # The models Ryker runs beside it, on the CPU: nothing is installed on the host, and each model
  # is in its image, pinned by revision and digest. They sit on a network of their own that only
  # Ryker joins, so the worker's boxes cannot reach them, and the network reaches nothing outside.
  # Ryker works without them, with less, and never waits for one to start.
  #
  # Voice messages (`Ryker.Transcription.Service`): `whisper` writes the words with
  # large-v3-turbo, about 15 s for each 30 s of speech, and `whisper-detect` only hears the
  # language, with whisper's small model, in about 3 s.
  whisper:
    image: ryker-whisper:local
    build:
      context: .
      dockerfile: deploy/compose/models/whisper.Dockerfile
      args:
        MODEL_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-large-v3-turbo.bin
        MODEL_SHA256: 1fc70f774d38eb169993ac391eea357ef47c88757ef72ee5943879b7e8e2bc69
    restart: unless-stopped
    networks:
      - models
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 60
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  whisper-detect:
    image: ryker-whisper-detect:local
    build:
      context: .
      dockerfile: deploy/compose/models/whisper.Dockerfile
      args:
        MODEL_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-small.bin
        MODEL_SHA256: 1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b
    command: ["-dl"]
    restart: unless-stopped
    networks:
      - models
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 60
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Routing's search for earlier work by meaning: bge-m3 reads more than a hundred languages
  # into one space, so a Ukrainian or Spanish message finds work discussed in English. It reads
  # up to 8192 tokens and pools its first token (CLS), as the model was trained.
  embeddings:
    image: ryker-embeddings:local
    build:
      context: .
      dockerfile: deploy/compose/models/llama.Dockerfile
      args:
        MODEL_URL: https://huggingface.co/ggml-org/bge-m3-Q8_0-GGUF/resolve/9eba04c5d75ba5a1595e45de734d36bef4e5cb98/bge-m3-q8_0.gguf
        MODEL_SHA256: aa473d51f451a22f0fcf39ba3330c14bed38a385712b1113440f69df4047a173
        MODEL_FILE: bge-m3-q8_0.gguf
    command: ["-m", "/models/bge-m3-q8_0.gguf", "--embeddings", "--pooling", "cls", "-c", "8192",
              "-b", "8192", "-ub", "8192", "--host", "0.0.0.0", "--port", "8080"]
    user: "1000:1000"
    restart: unless-stopped
    networks:
      - models
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 60
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # The local routing comparison (Settings › Models › Local routing model): Qwen2.5 3B answers
  # the routing question in the background, one request at a time with room for a whole routing
  # prompt; routing always decides with the provider model. Off unless COMPOSE_PROFILES in
  # .ryker/compose.env names routing-model. On the CPU a routing prompt keeps every core busy
  # for about a minute, so it gets them only when nothing else in the project wants them.
  routing-model:
    profiles: ["routing-model"]
    cpu_shares: 256
    image: ryker-routing-model:local
    build:
      context: .
      dockerfile: deploy/compose/models/llama.Dockerfile
      args:
        MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/7dabda4d13d513e3e842b20f0d435c732f172cbe/qwen2.5-3b-instruct-q4_k_m.gguf
        MODEL_SHA256: 626b4a6678b86442240e33df819e00132d3ba7dddfe1cdc4fbb18e0a9615c62d
        MODEL_FILE: qwen2.5-3b-instruct-q4_k_m.gguf
    command: ["-m", "/models/qwen2.5-3b-instruct-q4_k_m.gguf", "--alias", "qwen2.5:3b", "-c", "16384",
              "-np", "1", "--jinja", "--host", "0.0.0.0", "--port", "8080"]
    user: "1000:1000"
    restart: unless-stopped
    networks:
      - models
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 60
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  ryker-database:
  ryker-state:
  ryker-coop-state:
  ryker-coop-config:
  ryker-coop-docker:
  ryker-coop-docker-socket:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.42.0/24
  models:
    internal: true
