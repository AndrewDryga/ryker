services:
  episode-db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: responder_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d responder_test"]
      interval: 200ms
      timeout: 2s
      retries: 30
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
