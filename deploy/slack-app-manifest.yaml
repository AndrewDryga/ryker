_metadata:
  major_version: 1
display_information:
  name: Ryker
  description: AI teammate for alerts, code, and on-call work
  long_description: >-
    Ryker is your AI teammate for on-call work. Ask a question, share an alert, or hand it a
    coding task. It investigates problems, shows its work, and keeps you updated in Slack and
    GitHub. It can prepare draft pull requests and carry out requested fixes through Emisar,
    following your team's rules and approvals. Review its findings before acting.
  background_color: "#111315"
features:
  agent_view:
    agent_description: >-
      Ask a question, share an alert, or work on a fix. Ryker shows what it found and
      keeps you updated.
    suggested_prompts:
      - title: Production health
        message: How healthy is production right now? Check it live and tell me what needs attention.
      - title: Explain an alert
        message: What happened with the latest alert, is it still going on, and what should we do?
      - title: Open work
        message: What are you working on, what is blocked, and what do you need from us?
    actions:
      - name: Investigate production
        description: Check production live and say what needs attention.
      - name: Explain alert
        description: Explain an alert where it was posted, without opening an incident.
      - name: Prepare handoff
        description: Sum up what is known, what is not, and what comes next.
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Ryker
    always_online: false
  slash_commands:
    - command: /ryker
      description: Check Ryker's status and control how it takes part in this channel
      usage_hint: status | sign-in | proactive | shadow | assignments | help
      should_escape: false
  shortcuts:
    - name: Investigate message
      type: message
      callback_id: ryker_investigate_message
      description: Investigate this message without changing running systems
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - bookmarks:read
      - channels:history
      - channels:join
      - channels:manage
      - channels:read
      - chat:write
      - commands
      - files:read
      - files:write
      - groups:history
      - groups:read
      - groups:write
      - im:history
      - im:read
      - mpim:read
      - pins:write
      - reactions:read
      - reactions:write
      - usergroups:read
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - app_home_opened
      - channel_archive
      - channel_deleted
      - channel_unarchive
      - group_archive
      - group_deleted
      - group_unarchive
      - member_joined_channel
      - member_left_channel
      - message.channels
      - message.groups
      - message.im
      - reaction_added
      - reaction_removed
  incoming_webhooks:
    incoming_webhooks_enabled: false
  interactivity:
    is_enabled: true
  is_hosted: false
  is_mcp_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
