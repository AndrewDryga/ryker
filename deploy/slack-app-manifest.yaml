_metadata:
  major_version: 1
display_information:
  name: Emisar Responder
  description: Emisar's AI SRE First Responder
  long_description: >-
    Emisar Responder is Emisar's AI SRE First Responder for on-call teams. It turns
    authenticated monitoring alerts or an explicit authorized Slack incident request into a
    dedicated incident channel with a pinned live status card and an isolated Coop investigation.
    In configured operations feeds, it can triage human and monitoring-app messages, stay
    silent for noise, answer in context, offer an operator-confirmed incident, or automatically
    open one for a credible unresolved monitoring alert.
    App Home summarizes current work; the Agent Messages tab and message shortcut provide
    read-only evidence-backed investigation with semantic progress. Responses can show source
    observations, health-layer coverage, timelines, and shift handoffs.
    Explicit repository-change requests can offer an operator-confirmed engineering task in the
    same Slack thread, backed by an isolated writable Coop fork.
    Typed preferences and standing channel rules require operator confirmation, show their scope
    and expiry, and remain bounded read-only behavior rather than arbitrary executable memory.
    Operators can collaborate anywhere in the incident room without repeating an @mention,
    request status, inspect changes, run review, stop work, and close the incident. Responder
    automatically allocates investigation capacity up to an operator-configurable safety ceiling.
    The /responder command manages preferences, standing rules, proactive channel behavior,
    capacity policy, and incident controls. Infrastructure access remains policy-controlled and
    audited through Emisar.
    Responder never merges, deploys, signs commits, or bypasses infrastructure approvals.
    An operator-confirmed engineering task can publish its reviewed tree to a Responder-owned
    branch and draft pull request; that publication is explicit and cannot merge the PR.
    AI-generated investigation results can be incomplete or inaccurate and should be reviewed
    by an operator before action.
  background_color: "#0A0B0D"
features:
  agent_view:
    agent_description: >-
      Evidence-backed AI SRE that investigates Slack alerts and questions using
      repository context, Emisar, and authorized tools without creating incidents
      or changing infrastructure unless an operator explicitly asks.
    suggested_prompts:
      - title: Infrastructure health
        message: Assess current infrastructure health with live evidence.
      - title: Explain an alert
        message: Explain the latest alert in context and verify its current state.
    actions:
      - name: Investigate
        description: Correlate repository topology with live Emisar evidence.
      - name: Explain alert
        description: Assess an alert in channel context without automatically opening an incident.
      - name: Prepare handoff
        description: Summarize verified evidence, gaps, decisions, and next actions.
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Responder
    always_online: false
  slash_commands:
    - command: /responder
      description: Check incidents, configure Responder, and control incident work
      usage_hint: help | status | incidents | preferences | rules
      should_escape: false
  shortcuts:
    - name: Investigate message
      type: message
      callback_id: responder_investigate_message
      description: Run a read-only, evidence-backed investigation of this message
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - channels:history
      - channels:manage
      - channels:read
      - chat:write
      - commands
      - groups:history
      - groups:read
      - groups:write
      - im:history
      - pins:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - app_home_opened
      - channel_archive
      - channel_deleted
      - channel_unarchive
      - group_archive
      - group_deleted
      - group_unarchive
      - message.channels
      - message.groups
      - message.im
  incoming_webhooks:
    incoming_webhooks_enabled: false
  interactivity:
    is_enabled: true
  is_hosted: false
  is_mcp_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
