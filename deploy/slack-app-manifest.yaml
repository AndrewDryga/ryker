_metadata:
  major_version: 1
display_information:
  name: Ryker
  description: A proactive AI teammate in Slack and GitHub that shows its work and keeps you in control
  long_description: >-
    Ryker is a proactive AI teammate for on-call and infrastructure teams. Ask it an operational
    question, mention it on an alert, or invite it to a channel it should follow. It takes on
    engineering work, follows through on tasks, picks up alerts, and carries out requested fixes
    through Emisar, its governed connection to your infrastructure and tools. It reconciles the
    topology declared in your repositories with fresh evidence and reports what is healthy,
    degraded, and still unverified.
    Ryker is not given a generic production shell. It discovers typed infrastructure actions from
    a trusted Emisar catalog. Policy decides what runs, what waits for a person, and what is
    denied; an outbound-only runner validates the action, arguments, limits, and trusted pack hash
    again on the target host before execution. Pending approvals stay owned and audited by Emisar.
    Normal Slack questions are answered in their existing threads. Credible monitoring alerts can
    start a dedicated incident room, and explicit engineering requests can start an isolated,
    writable co:op task in the same thread. Operators can inspect evidence and changes, request
    review, publish a verified tree as a draft pull request, prepare a shift handoff, or close the
    work. Ryker cannot merge, deploy, sign commits, or bypass infrastructure policy and approval.
    Preferences and standing read-only rules need operator confirmation and show their exact scope,
    expiry, and safety boundary before they are saved.
    Invite Ryker to a channel and it asks a short series of questions, then shows the listening,
    repository, alert, and incident-audience settings before an operator confirms them. Operators
    can also ask for status, incidents, evidence, preferences, rules, and listening changes in
    conversation. The /ryker command remains a recovery surface for operators.
    AI-generated investigation results can be incomplete or inaccurate and should be reviewed by
    an operator before action.
  background_color: "#111315"
features:
  agent_view:
    agent_description: >-
      A proactive AI teammate that reconciles repository topology with fresh live
      evidence and uses only policy-controlled, host-validated infrastructure actions.
    suggested_prompts:
      - title: Production health
        message: Reconcile our declared production topology with fresh live evidence and report healthy, degraded, and unverified layers.
      - title: Explain an alert
        message: Explain the latest alert in context, verify its current state, and identify the next operator decision.
      - title: Open work
        message: What are you working on, what is blocked, and what do you owe the team?
    actions:
      - name: Investigate production
        description: Correlate repository topology with fresh, policy-controlled live evidence.
      - name: Explain alert
        description: Assess an alert in channel context without automatically creating an incident.
      - name: Prepare handoff
        description: Summarize verified evidence, gaps, decisions, and next actions.
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Ryker
    always_online: false
  slash_commands:
    - command: /ryker
      description: Check Ryker's status and control how it takes part in this channel
      usage_hint: status | proactive | shadow | help
      should_escape: false
  shortcuts:
    - name: Investigate message
      type: message
      callback_id: ryker_investigate_message
      description: Run a read-only, evidence-backed investigation of this message
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - bookmarks:read
      - canvases:write
      - channels:history
      - channels:join
      - channels:manage
      - channels:read
      - chat:write
      - commands
      - files:read
      - files:write
      - groups:history
      - groups:read
      - groups:write
      - im:history
      - im:read
      - mpim:read
      - pins:write
      - reactions:read
      - reactions:write
      - usergroups:read
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - app_home_opened
      - channel_archive
      - channel_deleted
      - channel_unarchive
      - group_archive
      - group_deleted
      - group_unarchive
      - member_joined_channel
      - message.channels
      - message.groups
      - message.im
      - reaction_added
      - reaction_removed
  incoming_webhooks:
    incoming_webhooks_enabled: false
  interactivity:
    is_enabled: true
  is_hosted: false
  is_mcp_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
