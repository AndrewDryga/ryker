version: 1
# `target` takes one target, or a list of up to 4 forming an ordered fallback ladder that may
# cross providers. When a provider rate limits a turn mid-incident, Coop moves the session to the
# next rung that is not cooling and re-delivers the same turn, so a usage limit costs a retry
# instead of the investigation. Every rung must already be signed in on the worker under the
# profile the ladder names (`@oncall` here), not just the one sessions start on; check each
# agent's credentials there before relying on the ladder. When every rung is cooling the turn
# waits and is retried rather than failing the work.
policies:
  # Standard work uses Sol/medium. These policies are read-only; model depth never grants writes.
  platform-observe:
    repository: /srv/repos/infrastructure
    repository_read_only: true
    companions:
      - name: backend
        repository: /srv/repos/backend
    target: codex:gpt-5.6-sol/medium@oncall
    max_turns: 100
    max_queued_turns: 20
    max_queued_bytes: 1048576
    turn_timeout: 1h
    max_patch_bytes: 1048576

  infrastructure-observe:
    repository: /srv/repos/infrastructure
    repository_read_only: true
    target: codex:gpt-5.6-sol/medium@oncall
    max_turns: 100
    max_queued_turns: 20
    max_queued_bytes: 1048576
    turn_timeout: 1h
    max_patch_bytes: 1048576

  backend-observe:
    repository: /srv/repos/backend
    repository_read_only: true
    target: codex:gpt-5.6-sol/medium@oncall
    max_turns: 100
    max_queued_turns: 20
    max_queued_bytes: 1048576
    turn_timeout: 1h
    max_patch_bytes: 1048576

  # Conversational work uses Terra/medium. The bounded idle lease keeps one authenticated ACP
  # process ready without leaving it running forever.
  infrastructure-conversation:
    repository: /srv/repos/infrastructure
    repository_read_only: true
    target: codex:gpt-5.6-terra/medium@oncall
    max_turns: 100
    max_queued_turns: 20
    max_queued_bytes: 1048576
    turn_timeout: 1h
    warm_idle_timeout: 15m
    max_patch_bytes: 1048576

  backend-conversation:
    repository: /srv/repos/backend
    repository_read_only: true
    target: codex:gpt-5.6-terra/medium@oncall
    max_turns: 100
    max_queued_turns: 20
    max_queued_bytes: 1048576
    turn_timeout: 1h
    warm_idle_timeout: 15m
    max_patch_bytes: 1048576

  platform-conversation:
    repository: /srv/repos/infrastructure
    repository_read_only: true
    companions:
      - name: backend
        repository: /srv/repos/backend
    target: codex:gpt-5.6-terra/medium@oncall
    max_turns: 100
    max_queued_turns: 20
    max_queued_bytes: 1048576
    turn_timeout: 1h
    warm_idle_timeout: 15m
    max_patch_bytes: 1048576

  # Deep work uses Sol/xhigh while keeping the same read-only repository and MCP authority.
  infrastructure-deep:
    repository: /srv/repos/infrastructure
    repository_read_only: true
    target: codex:gpt-5.6-sol/xhigh@oncall
    max_turns: 100
    max_queued_turns: 20
    max_queued_bytes: 1048576
    turn_timeout: 1h
    max_patch_bytes: 1048576

  backend-deep:
    repository: /srv/repos/backend
    repository_read_only: true
    target: codex:gpt-5.6-sol/xhigh@oncall
    max_turns: 100
    max_queued_turns: 20
    max_queued_bytes: 1048576
    turn_timeout: 1h
    max_patch_bytes: 1048576

  platform-deep:
    repository: /srv/repos/infrastructure
    repository_read_only: true
    companions:
      - name: backend
        repository: /srv/repos/backend
    target: codex:gpt-5.6-sol/xhigh@oncall
    max_turns: 100
    max_queued_turns: 20
    max_queued_bytes: 1048576
    turn_timeout: 1h
    max_patch_bytes: 1048576
