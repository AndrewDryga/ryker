version: 1
# `target` takes one target, or a list of up to 4 forming an ordered fallback ladder that may
# cross providers. When a provider rate limits a turn mid-incident, Coop moves the session to the
# next rung that is not cooling and re-delivers the same turn, so a usage limit costs a retry
# instead of the investigation. Every rung must already be signed in — `responder doctor` checks
# all of them, not just the one sessions start on. When every rung is cooling the turn waits and
# is retried rather than failing the work.
policies:
  # One writable primary plus operator-pinned read-only companion snapshots.
  platform-observe:
    repository: /srv/repos/infrastructure
    companions:
      - name: backend
        repository: /srv/repos/backend
    target: [codex:gpt-5.6/medium@oncall, claude@oncall]
    max_turns: 100
    max_queued_turns: 20
    max_queued_bytes: 1048576
    turn_timeout: 1h
    max_patch_bytes: 1048576

  infrastructure-observe:
    repository: /srv/repos/infrastructure
    target: [codex:gpt-5.6/medium@oncall, claude@oncall]
    max_turns: 100
    max_queued_turns: 20
    max_queued_bytes: 1048576
    turn_timeout: 1h
    max_patch_bytes: 1048576

  backend-observe:
    repository: /srv/repos/backend
    target: [codex:gpt-5.6/medium@oncall, claude@oncall]
    max_turns: 100
    max_queued_turns: 20
    max_queued_bytes: 1048576
    turn_timeout: 1h
    max_patch_bytes: 1048576

  # Conversation policies use the same Coop provider accounts and read-only tool surface. The
  # bounded idle lease keeps one authenticated ACP process ready without leaving it running forever.
  infrastructure-conversation:
    repository: /srv/repos/infrastructure
    target: codex:gpt-5.6/medium@oncall
    max_turns: 100
    max_queued_turns: 20
    max_queued_bytes: 1048576
    turn_timeout: 1h
    warm_idle_timeout: 15m
    max_patch_bytes: 1048576

  backend-conversation:
    repository: /srv/repos/backend
    target: codex:gpt-5.6/medium@oncall
    max_turns: 100
    max_queued_turns: 20
    max_queued_bytes: 1048576
    turn_timeout: 1h
    warm_idle_timeout: 15m
    max_patch_bytes: 1048576

  platform-conversation:
    repository: /srv/repos/infrastructure
    companions:
      - name: backend
        repository: /srv/repos/backend
    target: codex:gpt-5.6/medium@oncall
    max_turns: 100
    max_queued_turns: 20
    max_queued_bytes: 1048576
    turn_timeout: 1h
    warm_idle_timeout: 15m
    max_patch_bytes: 1048576
