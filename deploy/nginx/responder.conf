server {
    listen 443 ssl http2;
    server_name responder.example.com;

    ssl_certificate /etc/letsencrypt/live/responder.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/responder.example.com/privkey.pem;

    client_max_body_size 1m;

    location /v1/hooks/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
