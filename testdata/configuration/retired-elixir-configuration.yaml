# Harvested shape, authored values. This mirrors the retired application YAML of
# a real running installation, key for key and section for section, with every
# host-identifying value replaced by a structurally identical placeholder:
# tailnet hostname, absolute home paths, Slack workspace/bot/user/channel IDs,
# the control-plane lab conversation id and every policy digest.
#
# Its traps are the real ones: component mode with a local Coop socket while
# Work already runs on the fleet, an Emisar credential still named
# EMISAR_API_KEY, a webhook source pointed at a control-plane lab conversation
# with a deployment-owned custom secret, a hand-written source_and_action_tools
# list, non-default Slack and delivery tuning, and no github, publication or
# model_evals section at all.
