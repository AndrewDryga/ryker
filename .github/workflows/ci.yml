name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The full gate carries the whole suite plus the nine-minute retention
    # simulation; on a shared runner that does not fit in fifteen minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: full gate
        run: make check

  release-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: build and verify canonical Elixir release
        run: |
          set -eu
          make elixir-release-check
          version=$(awk '{print $2}' _build/prod/rel/responder/releases/start_erl.data)
          install -d -m 0755 dist
          install -m 0644 \
            "_build/prod/responder-${version}.tar.gz" \
            "dist/responder_${version}_elixir_linux_amd64.tar.gz"
          install -m 0755 scripts/install-elixir-release.sh dist/install-elixir-release.sh
          install -m 0755 scripts/check-elixir-release.sh dist/check-elixir-release.sh
          install -m 0755 scripts/activate-elixir-release.sh dist/activate-elixir-release.sh
          (cd dist && sha256sum \
            responder_*_elixir_linux_amd64.tar.gz \
            install-elixir-release.sh \
            check-elixir-release.sh \
            activate-elixir-release.sh > checksums.txt)
      - name: smoke release archives
        run: scripts/check-release.sh dist
