name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The full gate carries the whole suite plus the nine-minute retention
    # simulation; on a shared runner that does not fit in fifteen minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      # The names the redaction audit refuses are private, so the public repository cannot
      # hold them (test/ryker/redaction_audit_test.exs); CI reads them from a secret. Without
      # the secret the audit has no names to look for.
      - name: private names for the redaction audit
        env:
          RYKER_REDACTION_DENYLIST: ${{ secrets.RYKER_REDACTION_DENYLIST }}
        run: |
          if [ -n "$RYKER_REDACTION_DENYLIST" ]; then
            umask 077
            mkdir -p .ryker
            printf '%s\n' "$RYKER_REDACTION_DENYLIST" >.ryker/redaction-denylist
          fi
      - name: full gate
        run: make check

  release-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: build and verify canonical Elixir release
        run: make release-dist
      - name: smoke release archives
        run: scripts/check-release.sh dist
