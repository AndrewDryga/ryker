name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: full gate
        run: make check

  release-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: build and verify canonical Elixir release
        run: |
          set -eu
          make elixir-release-check
          install -d -m 0755 dist-input
          install -m 0644 \
            _build/prod/responder-*.tar.gz \
            dist-input/responder-elixir.tar.gz
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          version: v2.16.0
          args: release --snapshot --clean --skip=sign
      - name: stage canonical Elixir archive for verification
        run: |
          set -eu
          name=$(awk '$2 ~ /_elixir_linux_amd64[.]tar[.]gz$/ { print $2 }' dist/checksums.txt)
          test -n "$name"
          install -m 0644 dist-input/responder-elixir.tar.gz "dist/$name"
          install -m 0755 scripts/install-elixir-release.sh dist/install-elixir-release.sh
          install -m 0755 scripts/check-elixir-release.sh dist/check-elixir-release.sh
          install -m 0755 scripts/activate-elixir-release.sh dist/activate-elixir-release.sh
      - name: smoke release archives
        run: scripts/check-release.sh dist
