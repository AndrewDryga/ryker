name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: full gate
        run: make check

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1
      - name: verify annotated tag and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          printf '%s\n' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' || {
            echo "release tag must be semantic version vX.Y.Z" >&2
            exit 1
          }
          test "$(git cat-file -t "$TAG")" = tag || {
            echo "release tag must be annotated" >&2
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TAG^{}" FETCH_HEAD || {
            echo "release tag must point to a commit in origin/main history" >&2
            exit 1
          }
          version=${TAG#v}
          heading=$(awk '/^## / { print $2; exit }' CHANGELOG.md)
          test "$heading" = "$version" || {
            echo "CHANGELOG.md top section must be ## $version, got ## $heading" >&2
            exit 1
          }
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | grep -v '^<!--' > /tmp/release-notes.md
          grep -q '[^[:space:]]' /tmp/release-notes.md || {
            echo "release notes are empty" >&2
            exit 1
          }
      - name: build and verify canonical Elixir release
        run: |
          set -eu
          make elixir-release-check
          version=${GITHUB_REF_NAME#v}
          install -d -m 0755 dist
          install -m 0644 \
            "_build/prod/ryker-${version}.tar.gz" \
            "dist/ryker_${version}_elixir_linux_amd64.tar.gz"
          install -m 0755 scripts/install-elixir-release.sh dist/install-elixir-release.sh
          install -m 0755 scripts/check-elixir-release.sh dist/check-elixir-release.sh
          install -m 0755 scripts/activate-elixir-release.sh dist/activate-elixir-release.sh
          (cd dist && sha256sum \
            ryker_*_elixir_linux_amd64.tar.gz \
            install-elixir-release.sh \
            check-elixir-release.sh \
            activate-elixir-release.sh > checksums.txt)
          cosign sign-blob dist/checksums.txt \
            --bundle=dist/checksums.txt.bundle \
            --yes
      - name: smoke release archives
        run: scripts/check-release.sh dist "$GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ryker_*.tar.gz
      - name: publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md \
            dist/ryker_*_elixir_linux_amd64.tar.gz \
            dist/install-elixir-release.sh \
            dist/check-elixir-release.sh \
            dist/activate-elixir-release.sh \
            dist/checksums.txt \
            dist/checksums.txt.bundle
          gh release edit "$GITHUB_REF_NAME" --draft=false
