name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: full gate
        run: make check

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1
      - name: verify annotated tag and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          printf '%s\n' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' || {
            echo "release tag must be semantic version vX.Y.Z" >&2
            exit 1
          }
          test "$(git cat-file -t "$TAG")" = tag || {
            echo "release tag must be annotated" >&2
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TAG^{}" FETCH_HEAD || {
            echo "release tag must point to a commit in origin/main history" >&2
            exit 1
          }
          version=${TAG#v}
          heading=$(awk '/^## / { print $2; exit }' CHANGELOG.md)
          test "$heading" = "$version" || {
            echo "CHANGELOG.md top section must be ## $version, got ## $heading" >&2
            exit 1
          }
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | grep -v '^<!--' > /tmp/release-notes.md
          grep -q '[^[:space:]]' /tmp/release-notes.md || {
            echo "release notes are empty" >&2
            exit 1
          }
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          version: v2.16.0
          args: release --clean --draft --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: smoke release archives
        run: scripts/check-release.sh dist "$GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/responder_*.tar.gz
      - name: publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
