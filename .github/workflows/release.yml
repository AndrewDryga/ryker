name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify
        run: make check
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: reachable vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="responder_${VERSION#v}_${os}_${arch}"
            mkdir "dist/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X github.com/AndrewDryga/responder/internal/version.Version=${VERSION}" \
              -o "dist/$name/responder" ./cmd/responder
            cp README.md CHANGELOG.md LICENSE SECURITY.md "dist/$name/"
            cp -R config deploy docs "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
          cd dist
          sha256sum responder_*.tar.gz > SHA256SUMS
      - name: Attest release archives
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/responder_*.tar.gz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/responder_*.tar.gz dist/SHA256SUMS \
            --verify-tag --generate-notes
