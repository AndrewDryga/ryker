name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tagged commit reached main, and CI ran the full gate on that push. A
  # release takes that result instead of spending the gate's time again, waiting
  # for it while it still runs. A red result refuses the release; only a run that
  # never finished (a later push cancels the one before it) leaves the release to
  # run CI itself.
  ci-result:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - name: CI's result for the tagged commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          while :; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push" \
              --jq '[.workflow_runs[] | {status, conclusion}]')
            echo "$runs" | jq -e 'any(.status != "completed")' >/dev/null || break
            sleep 30
          done
          if echo "$runs" | jq -e 'any(.conclusion == "success")' >/dev/null; then
            echo "CI passed on $SHA"
            echo passed=true >>"$GITHUB_OUTPUT"
          elif echo "$runs" | jq -e 'any(.conclusion == "failure")' >/dev/null; then
            echo "CI failed on $SHA; fix main and tag a commit CI passed" >&2
            exit 1
          else
            echo "no finished CI run on $SHA, so the release runs it"
            echo passed=false >>"$GITHUB_OUTPUT"
          fi

  verify:
    needs: ci-result
    if: needs.ci-result.outputs.passed != 'true'
    uses: ./.github/workflows/ci.yml

  # The build runs Ryker's own code and its dependencies' (Mix tasks, compile-time
  # macros), so it gets no signing rights: it hands the publish job only what it
  # built (2026-10-04 review).
  build:
    needs: [ci-result, verify]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: verify annotated tag and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          printf '%s\n' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' || {
            echo "release tag must be semantic version vX.Y.Z" >&2
            exit 1
          }
          test "$(git cat-file -t "$TAG")" = tag || {
            echo "release tag must be annotated" >&2
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TAG^{}" FETCH_HEAD || {
            echo "release tag must point to a commit in origin/main history" >&2
            exit 1
          }
          version=${TAG#v}
          heading=$(awk '/^## / { print $2; exit }' CHANGELOG.md)
          test "$heading" = "$version" || {
            echo "CHANGELOG.md top section must be ## $version, got ## $heading" >&2
            exit 1
          }
          test "$(scripts/elixir-release-version.sh)" = "$version"
      - name: build and verify canonical Elixir release
        run: |
          set -eu
          make release-dist
          test -f "dist/ryker_${GITHUB_REF_NAME#v}_elixir_linux_amd64.tar.gz" || {
            echo "the built release is not the tagged version ${GITHUB_REF_NAME#v}" >&2
            exit 1
          }
      - name: Extract release notes after building from the clean tree
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          mkdir -p notes
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | grep -v '^<!--' > notes/release-notes.md
          grep -q '[^[:space:]]' notes/release-notes.md || {
            echo "release notes are empty" >&2
            exit 1
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            notes/release-notes.md
          if-no-files-found: error

      - name: Build and check the Linux container images
        shell: bash
        run: |
          set -euo pipefail
          export RYKER_VERSION=${GITHUB_REF_NAME#v}
          export RYKER_IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          python3 -B deploy/worker-vm/test-launch.py
          docker buildx bake -f deploy/worker-vm/docker-bake.hcl --load
          controller="$RYKER_IMAGE_REPOSITORY:$RYKER_VERSION"
          worker="$RYKER_IMAGE_REPOSITORY-worker-vm:$RYKER_VERSION"
          test "$(docker run --rm --network none --entrypoint /opt/ryker/bin/ryker "$controller" version)" = "ryker $RYKER_VERSION"
          docker run --rm --network none --entrypoint isoinfo "$worker" -i /opt/worker/tools.iso -R -f > worker-files.txt
          for tool in /coop /connect.sh /egress.sh /engine/dockerd; do
            grep -Fx "$tool" worker-files.txt
          done
          docker image save "$controller" "$worker" | gzip -1 > container-images.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-images
          path: container-images.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    # GitHub propagates the skipped fallback CI job through the dependency
    # chain. A successful build already proves one of the two CI paths passed.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      # Only for scripts/check-release.sh; nothing from this checkout is built or run
      # but that check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: built
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.1
      - name: sign the checksum manifest
        run: |
          set -eu
          cosign sign-blob built/dist/checksums.txt \
            --bundle=built/dist/checksums.txt.bundle \
            --yes
      - name: smoke release archives
        run: scripts/check-release.sh built/dist "$GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: built/dist/ryker_*.tar.gz
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-images
          path: built
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the checked images and record their digests
        id: images
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker image load --input built/container-images.tar.gz
          for role in controller worker; do
            image=$repository
            if [[ $role == worker ]]; then image="$repository-worker-vm"; fi
            docker push "$image:$version"
            ref=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image:$version" |
              awk -F@ -v image="$image" '$1 == image { print }')
            digest=${ref#*@}
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s\n' "$ref" >> built/dist/container-images.txt
            printf '%s_name=%s\n%s_digest=%s\n' "$role" "$image" "$role" "$digest" >> "$GITHUB_OUTPUT"
          done
          cat built/dist/container-images.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.controller_name }}
          subject-digest: ${{ steps.images.outputs.controller_digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.worker_name }}
          subject-digest: ${{ steps.images.outputs.worker_digest }}
          push-to-registry: true
      - name: publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file built/notes/release-notes.md \
            built/dist/ryker_*_elixir_linux_amd64.tar.gz \
            built/dist/checksums.txt \
            built/dist/checksums.txt.bundle \
            built/dist/container-images.txt
          gh release edit "$GITHUB_REF_NAME" --draft=false
