name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # The same full gate CI runs, with the time CI gives it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: full gate
        run: make check

  # The build runs Ryker's own code and its dependencies' (Mix tasks, compile-time
  # macros), so it gets no signing rights: it hands the publish job only what it
  # built (2026-10-04 review).
  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: verify annotated tag and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          printf '%s\n' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' || {
            echo "release tag must be semantic version vX.Y.Z" >&2
            exit 1
          }
          test "$(git cat-file -t "$TAG")" = tag || {
            echo "release tag must be annotated" >&2
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TAG^{}" FETCH_HEAD || {
            echo "release tag must point to a commit in origin/main history" >&2
            exit 1
          }
          version=${TAG#v}
          heading=$(awk '/^## / { print $2; exit }' CHANGELOG.md)
          test "$heading" = "$version" || {
            echo "CHANGELOG.md top section must be ## $version, got ## $heading" >&2
            exit 1
          }
          mkdir -p notes
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | grep -v '^<!--' > notes/release-notes.md
          grep -q '[^[:space:]]' notes/release-notes.md || {
            echo "release notes are empty" >&2
            exit 1
          }
      - name: build and verify canonical Elixir release
        run: |
          set -eu
          make release-dist
          test -f "dist/ryker_${GITHUB_REF_NAME#v}_elixir_linux_amd64.tar.gz" || {
            echo "the built release is not the tagged version ${GITHUB_REF_NAME#v}" >&2
            exit 1
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            notes/release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      # Only for scripts/check-release.sh; nothing from this checkout is built or run
      # but that check.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: built
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1
      - name: sign the checksum manifest
        run: |
          set -eu
          cosign sign-blob built/dist/checksums.txt \
            --bundle=built/dist/checksums.txt.bundle \
            --yes
      - name: smoke release archives
        run: scripts/check-release.sh built/dist "$GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: built/dist/ryker_*.tar.gz
      - name: publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file built/notes/release-notes.md \
            built/dist/ryker_*_elixir_linux_amd64.tar.gz \
            built/dist/checksums.txt \
            built/dist/checksums.txt.bundle
          gh release edit "$GITHUB_REF_NAME" --draft=false
